name: Android Instrumentation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "app/src/androidTest/**"
      - "app/schemas/**"
      - "app/src/main/java/com/example/fitto/data/local/**"
      - ".github/actions/setup-android-project/**"
      - ".github/workflows/android-instrumentation.yml"
  push:
    branches: [main]
    paths:
      - "app/src/androidTest/**"
      - "app/schemas/**"
      - "app/src/main/java/com/example/fitto/data/local/**"
      - ".github/actions/setup-android-project/**"
      - ".github/workflows/android-instrumentation.yml"

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: API 33 emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Android project
        uses: ./.github/actions/setup-android-project

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 2048M
          heap-size: 1024M
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -no-metrics
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
