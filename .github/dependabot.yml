version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "build"
      include: scope
    groups:
      android-and-kotlin:
        patterns:
          - "androidx.*"
          - "com.android.*"
          - "com.google.android.*"
          - "org.jetbrains.kotlin*"
        update-types:
          - minor
          - patch
      firebase:
        patterns:
          - "com.google.firebase*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "ci"
      include: scope
